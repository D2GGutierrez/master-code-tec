name: admin-api

# Sin filtro de rutas: con la protección de ramas, un PR de otra carpeta se quedaría esperando un chequeo que nunca corre.
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  admin-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: admin-api/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check

      - name: Pruebas
        run: python manage.py test
        env:
          DJANGO_SECRET_KEY: clave-falsa-solo-para-ci
          POSTGRES_DB: falso
          POSTGRES_USER: falso
          POSTGRES_PASSWORD: falso

      - name: Construir imagen
        run: docker build -t master-code-admin-api .
